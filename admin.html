<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171717">
  <title>Connexion administrateur — Œil de Tigre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/config.js"></script>
</head>
<body style="min-height:100vh;background:var(--cream);display:grid;place-items:center;padding:24px">
  <main class="dialog-card" style="width:min(440px,100%);box-shadow:0 15px 55px #241b1012">
    <a class="brand" href="/" aria-label="Retour à la boutique">ŒIL DE <span>TIGRE</span></a>
    <p class="eyebrow" style="margin-top:38px">ESPACE PRIVÉ</p>
    <h1 style="font:600 32px 'Playfair Display',Georgia,serif;margin:0 0 10px">Connexion administrateur</h1>
    <p class="muted">Connectez-vous pour gérer les produits et les commandes de votre boutique.</p>
    <form id="adminPageLogin">
      <label>Adresse e-mail
        <input id="adminPageEmail" type="email" autocomplete="username" value="theclagebako@gmail.com" required>
      </label>
      <label>Mot de passe
        <input id="adminPagePassword" type="password" autocomplete="current-password" required placeholder="Votre mot de passe Supabase">
      </label>
      <button id="adminPageSubmit" class="button button-orange full-width" type="submit">Se connecter</button>
      <p id="adminPageFeedback" class="form-feedback" role="status"></p>
    </form>
    <a href="/" style="display:inline-block;margin-top:14px;font-size:12px;color:var(--muted)">← Retour à la boutique</a>
  </main>
  <script>
    (() => {
      const cfg = window.APP_CONFIG || {};
      const feedback = document.getElementById("adminPageFeedback");
      const form = document.getElementById("adminPageLogin");
      const submit = document.getElementById("adminPageSubmit");
      if (!window.supabase || !cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) {
        feedback.textContent = "La connexion Supabase n'est pas configurée.";
        feedback.classList.add("error");
        return;
      }
      const db = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
      db.auth.getSession().then(({data}) => {
        if (data.session) window.location.replace("/?admin=1");
      });
      form.addEventListener("submit", async event => {
        event.preventDefault();
        submit.disabled = true;
        feedback.classList.remove("error");
        feedback.textContent = "Connexion en cours…";
        const {error} = await db.auth.signInWithPassword({
          email: document.getElementById("adminPageEmail").value.trim(),
          password: document.getElementById("adminPagePassword").value
        });
        submit.disabled = false;
        if (error) {
          feedback.textContent = "Connexion refusée. Vérifiez le mot de passe et le compte administrateur Supabase.";
          feedback.classList.add("error");
          return;
        }
        window.location.replace("/?admin=1");
      });
    })();
  </script>
</body>
</html>
